name: Native toolchain hosts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-host:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
          - os: windows-latest
            host: x86_64-pc-windows-msvc
    env:
      CARGO_TERM_COLOR: always
      PYTHONUTF8: "1"
      NESTRS_CI_HOST: ${{ matrix.host }}
      # Keep MSVC linker diagnostics recognizable to rustc on either runner locale.
      VSLANG: "1033"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Select the repository's exact toolchain
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          pin = json.loads(Path("cargo-nestrs/toolchain.json").read_text(encoding="utf-8"))
          host = os.environ["NESTRS_CI_HOST"]
          if host not in pin["hosts"]:
              raise SystemExit(f"The CI host is not supported by the repository pin: {host}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"RUSTUP_TOOLCHAIN={pin['release']}-{host}\n")

      - name: Install the selected compiler and components
        shell: python
        run: |
          import os
          import subprocess

          subprocess.run([
              "rustup", "toolchain", "install", os.environ["RUSTUP_TOOLCHAIN"],
              "--profile", "minimal", "--component", "rustc-dev",
              "--component", "rust-src", "--component", "rustfmt",
              "--component", "clippy",
          ], check=True)

      # The helper checks release, full commit, and native host. It does not
      # accept a newer stable compiler when the pinned distribution is missing.
      - name: Build the complete CLI, driver, and private bridge
        run: python tools/build-toolchain.py

      - name: Check formatting and ordinary core/tool tests
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.run([sys.executable, "tools/test_toolchain_support.py"], check=True)
          subprocess.run(["cargo", "fmt", "--check"], check=True)
          packages = ["-p", "nestrs-core", "-p", "cargo-nestrs", "-p", "nestrs-tool-bridge"]
          subprocess.run(["cargo", "test", *packages], check=True)
          subprocess.run([
              "cargo", "clippy", *packages, "--all-targets", "--", "-D", "warnings",
          ], check=True)

      - name: Exercise real native builds, graph, IDE model, and rustdoc
        shell: python
        run: |
          import os
          import subprocess

          environment = os.environ.copy()
          environment["RUSTC_BOOTSTRAP"] = "nestrs_driver"
          targets = [
              "-p", "cargo-nestrs", "--features", "compiler-driver",
              "--test", "native_host", "--test", "bridge_metadata", "--test", "rustdoc",
          ]
          subprocess.run([
              "cargo", "test", *targets, "--", "--nocapture",
          ], env=environment, check=True)
          subprocess.run([
              "cargo", "clippy", "-p", "cargo-nestrs", "--features", "compiler-driver",
              "--all-targets", "--", "-D", "warnings",
          ], env=environment, check=True)
