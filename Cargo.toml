[workspace]
resolver = "3"
members = ["nestrs-core", "cargo-nestrs", "cargo-nestrs/internal/bridge", "example/di-checkout"]
# The private bridge is built with the pinned driver by tools/build-toolchain.py.
default-members = ["nestrs-core", "cargo-nestrs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "基于 Nestjs 的范式结合 Springboot 的功能设计，打造 Rust 语言的 Nestjs 框架"
repository= "https://github.com/Fangfang2468/nestrs-framework"
authors = ["Frank Fang"]
license = "MIT"

[workspace.dependencies]

# 编译期生成、Cargo CLI 与项目元数据工具
clap = "4"
proc-macro2 = "1.0"
syn = { version = "2.0.118", features = ["full"] }
quote = "1.0.46"
zyn = "0.5.4"
cargo_metadata = "0.23.1"
walkdir = "2.5.0"
toml = "1.1.4"

# 基础工具
ahash = "0.8.12"
thiserror = "2"             # 错误定义
anyhow = "1.0.103"          # 应用级错误上下文
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "sync", "macros", "time"] }


# 底层工具
serde = "1"                 # 序列化/反序列化框架
serde_json = "1"            # 工具协议、编译产物和审阅数据的 JSON 编解码
chrono = "0.4"              # 时间处理
rand = "0.8"                # 统一依赖版本；此声明本身不代表框架提供认证或令牌能力
memsafe = "1.0.2"


# 遥测库
opentelemetry = "0.32.0"
